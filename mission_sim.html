<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #cesiumContainer { width:100%; height:100%; }
  .sim-overlay {
    position:absolute; top:12px; left:12px; z-index:999;
    background:rgba(5,13,27,0.92); border:1px solid #173653;
    border-radius:12px; padding:14px 18px; color:#eaf4ff;
    font-family:'Inter',sans-serif; min-width:260px;
    backdrop-filter:blur(8px);
  }
  .sim-overlay h3 { margin:0 0 8px; font-size:0.85rem; color:#22d3ee; letter-spacing:0.08em; }
  .sim-overlay .telemetry { font-family:'Space Mono',monospace; font-size:0.72rem; color:#8ba7c2; line-height:1.7; }
  .sim-overlay .telemetry span { color:#f1f8ff; }
  .hazard-alert {
    position:absolute; top:12px; right:12px; z-index:999;
    background:rgba(127,29,29,0.9); border:2px solid #ef4444;
    border-radius:10px; padding:12px 16px; color:#fecaca;
    font-family:'Inter',sans-serif; font-weight:700; font-size:0.8rem;
    display:none; animation:pulse 0.8s infinite alternate;
  }
  @keyframes pulse { from{opacity:1} to{opacity:0.6} }
  .sim-controls {
    position:absolute; bottom:12px; left:12px; z-index:999;
    background:rgba(5,13,27,0.92); border:1px solid #173653;
    border-radius:12px; padding:12px 16px; color:#eaf4ff;
    font-family:'Inter',sans-serif;
  }
  .sim-controls button {
    background:#073b50; border:1px solid #167d96; color:#dffaff;
    border-radius:6px; padding:6px 14px; margin:3px; cursor:pointer;
    font-weight:600; font-size:0.75rem;
  }
  .sim-controls button:hover { border-color:#22d3ee; background:#0a4a63; }
  .sim-controls button.active { background:#164e63; border-color:#22d3ee; }
  .sim-controls label { font-size:0.68rem; color:#8ba7c2; display:block; margin-top:6px; }
  .sim-controls select, .sim-controls input {
    background:#0b2038; border:1px solid #173653; color:#eaf4ff;
    border-radius:5px; padding:4px 8px; font-size:0.72rem; width:100%;
  }
</style>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet"/>
</head>
<body>
<div id="cesiumContainer"></div>

<div class="sim-overlay">
  <h3>🚀 MISSION TELEMETRY</h3>
  <div class="telemetry">
    T+ <span id="t-time">0.0</span> s<br/>
    ALT <span id="t-alt">0</span> km<br/>
    VEL <span id="t-vel">0</span> m/s<br/>
    PITCH <span id="t-pitch">90.0</span>°<br/>
    G-LOAD <span id="t-g">1.0</span> g<br/>
    FUEL <span id="t-fuel">100</span>%<br/>
    O₂ <span id="t-o2">21.0</span>%
  </div>
</div>

<div class="hazard-alert" id="hazardAlert">
  ⚠️ FIRE HAZARD DETECTED<br/>
  <span id="hazardType" style="font-weight:400;font-size:0.7rem"></span>
</div>

<div class="sim-controls">
  <button id="btnLaunch" onclick="startLaunch()">🚀 LAUNCH</button>
  <button id="btnReset" onclick="resetSim()">↺ RESET</button>
  <button id="btnInterior" onclick="toggleInterior()">🔍 INTERIOR</button>
  <label>ROCKET</label>
  <select id="rocketSelect" onchange="changeRocket()">
    <option value="sls">SLS Block 1 (98m)</option>
    <option value="falcon9">Falcon 9 Block 5 (70m)</option>
    <option value="falconheavy">Falcon Heavy (70m)</option>
    <option value="atlasv">Atlas V 551 (58m)</option>
    <option value="delta4">Delta IV Heavy (72m)</option>
  </select>
  <label>AMBIENT O₂ (%)</label>
  <input type="range" id="o2Slider" min="10" max="35" value="21" oninput="updateO2(this.value)"/>
  <label>FUEL: <span id="fuelLabel">RP-1 / LOX</span></label>
  <label>LAUNCH SITE (click globe or type)</label>
  <input type="text" id="coordInput" placeholder="lat,lng e.g. 28.6,80.7" onkeydown="if(event.key==='Enter')setLaunchSite(this.value)"/>
</div>

  geocoder: false,

  navigationHelpButton: false,
  animation: false,
  timeline: false,

// ==================== 3D ROCKET (PROCEDURAL) ====================
function createRocketModel() {
  const spec = ROCKETS[currentRocket];
  const scale = spec.height / 70.0; // normalize to falcon9

  // Remove old
  if (rocketEntity) viewer.entities.remove(rocketEntity);
  interiorEntities.forEach(e => viewer.entities.remove(e));
  interiorEntities = [];

  // Main body - cylinder
  const bodyHeight = 40 * scale;
  const bodyRadius = 3 * scale;

  rocketEntity = viewer.entities.add({
    position: launchSite,
    orientation: Cesium.Transforms.headingPitchRollToQuaternion(
      Cesium.Cartesian3.fromDegrees(28.618, 80.651), 0, 0, 0
    ),
    model: undefined,
    // Use a box as placeholder (we'll use a custom primitive for the actual shape)
  });

  // Custom primitive for rocket body
  const rocketPrimitive = createRocketPrimitive(spec, scale);
  viewer.scene.primitives.add(rocketPrimitive);
  window._rocketPrimitive = rocketPrimitive;

  // Launch pad marker
  viewer.entities.add({
    position: launchSite,
    marker: { color: Cesium.Color.CYAN, width: 2, size: 12, glyph: Cesium.MarkerGlyph.TRIANGLE },
    label: { text: spec.name, font: "12px Inter", fillColor: Cesium.Color.WHITE,
             verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, 12) }
  });
}

function createRocketPrimitive(spec, scale) {
  // Build a simple rocket shape using Cesium's geometry
  const positions = [];
  const indices = [];
  const numSides = 24;
  
  // Body (cylinder)
  const bodyR = 2.5 * scale;
  const bodyH = 35 * scale;
  const noseH = 15 * scale;
  
  // We'll use a simpler approach: a cone (nose) + cylinder (body) + cone (engine bell)
  // For the hackathon, use Cesium's built-in geometry
  
  // Actually, let's use a simpler visual: a colored entity with a custom appearance
  // The "rocket" will be represented by a vertical line + glow effect
  
  const geometryInstances = [];
  
  // Body cylinder
  const bodyGeom = new Cesium.CylinderGeometry({
    length: bodyH,
    topRadius: bodyR,
    bottomRadius: bodyR,
    radialSegments: 24
  });
  
  // Nose cone
  const noseGeom = new Cesium.ConeGeometry({
    length: noseH,
    bottomRadius: bodyR,
    radialSegments: 24
  });
  
  // Engine bell
  const engineGeom = new Cesium.ConeGeometry({
    length: 5 * scale,
    bottomRadius: bodyR * 0.6,
    topRadius: bodyR * 1.2,
    radialSegments: 24
  });
  
  // Create a combined geometry
  const material = new Cesium.ColorMaterialProperty(
    Cesium.Color.fromBytes(spec.color[0], spec.color[1], spec.color[2], 255)
  );
  
  // For simplicity in the hackathon, we'll use a PointPrimitive with glow + a Line for the body
  // This gives a "laser rocket" look that's actually very cool
  
  return new Cesium.CompositeGeometry([
    new Cesium.Primitive({
      geometryInstances: new Cesium.GeometryInstance({
        geometry: bodyGeom,
        modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(launchSite)
      }),
      appearance: new Cesium.MaterialAppearance({
        material: Cesium.Material.fromType("Color"),
        flat: true
      })
    })
  ]);
}

// Simpler approach: use entities for the rocket (more reliable in Streamlit iframe)
function createRocketEntity() {
  const spec = ROCKETS[currentRocket];
  
  if (rocketEntity) viewer.entities.remove(rocketEntity);
  
  // Rocket as a billboard with custom canvas texture
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  // Draw rocket
  ctx.fillStyle = '#fff';
  ctx.fillRect(24, 30, 16, 180); // body
  ctx.beginPath();
  ctx.moveTo(24, 30);
  ctx.lineTo(32, 0);
  ctx.lineTo(40, 30);
  ctx.fill(); // nose
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(20, 210, 24, 10); // engine
  ctx.fillStyle = '#f97316';
  ctx.beginPath();
  ctx.moveTo(22, 220);
  ctx.lineTo(32, 250);
  ctx.lineTo(42, 220);
  ctx.fill(); // flame
  
  const texture = new Cesium.Image(canvas.width, canvas.height, new Uint8Array(canvas.toDataURL ? 0 : 0));
  
  // Use a simpler approach: colored box entity
  rocketEntity = viewer.entities.add({
    position: launchSite,
    box: {
      dimensions: new Cesium.Cartesian3(4 * spec.height/70, 4 * spec.height/70, spec.height * 2),
      material: Cesium.Color.WHITE.withAlpha(0.9),
    },
    orientation: Cesium.Transforms.headingPitchRollToQuaternion(
      Cesium.Cartesian3.fromDegrees(0,0), 0, 0, 0
    )
  });
}
